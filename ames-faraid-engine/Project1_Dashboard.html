const awlN=CASES.filter(c=>c.awl).length,raddN=CASES.filter(c=>c.radd).length,tanzN=CASES.filter(c=>c.tanzeel).length;
const totE=CASES.reduce((a,c)=>a+c.total_value,0),totA=CASES.reduce((a,c)=>a+c.asset_value,0);
document.getElementById("sbar").innerHTML=[
  ["20","Total Cases"],[awlN,"'Awl"],[raddN,"Radd"],[tanzN,"Tanzeel"],
  ["\u20a6"+Math.round(totE/1e9*10)/10+"B","Total Estates"],
  ["\u20a6"+Math.round(totA/1e9*10)/10+"B","Asset Value"],
].map(([n,l])=>`<div class="si"><div class="sn">${n}</div><div class="sl">${l}</div></div>`).join("");

function rl(cases){
  document.getElementById("clist").innerHTML=cases.map(c=>{
    const tag=c.tanzeel?"<span class=\"bj btz\">Tanzeel</span>":c.awl?"<span class=\"bj ba\">\'Awl</span>":c.radd?"<span class=\"bj br\">Radd</span>":"<span class=\"bj bs\">Std</span>";
    const sn=c.name.replace("Late Mr. ","").replace("Late Mrs. ","").split(" of ")[0];
    return `<div class="ci" id="ci-${c.id}" onclick="show(${c.id})"><div><span class="cn">${c.id}</span></div><div><div class="ct">${sn}</div><div class="cll">${c.location}</div><div class="cbt">${tag}</div></div></div>`;
  }).join("");
}
rl(CASES);
function fil(){const q=document.getElementById("sinp").value.toLowerCase();rl(CASES.filter(c=>c.name.toLowerCase().includes(q)||c.location.toLowerCase().includes(q)));}

let pc=null,bc=null;
function f2n(f){if(!f||f==="\u2014"||f==="0"||f==="\u2014")return 0;const p=f.split("/");return p.length===2?+p[0]/+p[1]:+p[0];}

function show(id){
  document.querySelectorAll(".ci").forEach(e=>e.classList.remove("active"));
  const el=document.getElementById("ci-"+id);if(el)el.classList.add("active");
  const c=CASES.find(x=>x.id===id);if(!c)return;
  const tl=c.tanzeel?"Tanzeel (Dhul Arham)":c.awl?"'Awl":c.radd?"Radd":"Standard";
  const tcss=c.tanzeel?"var(--ora)":c.awl?"var(--pur)":c.radd?"var(--blue)":"var(--g2)";
  const inh=c.table.filter(r=>r.status==="Inherits");
  const blk=c.table.filter(r=>r.status.includes("Blocked"));
  const excl=c.table.filter(r=>r.status.includes("Excluded"));
  const assH=c.assets.map(a=>`<span class="at">${a}</span>`).join("");
  const notH=c.notes.filter(n=>!n.startsWith("  \u00b7")&&!n.startsWith("  \u00b7")&&!n.includes("steps down")).map(n=>`<div class="fn">${n}</div>`).join("");
  const tblR=c.table.map(r=>{
    const cl=r.status==="Inherits"?"inh":r.status.includes("Blocked")?"blk":r.status.includes("Excluded")?"excl":"dha";
    return `<tr><td><strong>${r.heir}</strong></td><td style="text-align:center">${r.count}</td><td class="${cl}">${r.status}</td><td style="text-align:center;font-family:monospace">${r.share_fraction}</td><td style="text-align:center;font-family:monospace">${r.share_per_person}</td><td>${r.naira_amount}</td></tr>`;
  }).join("");
  document.getElementById("det").innerHTML=`
    <div class="dh">
      <div><h2>${c.name}</h2><p>${c.location} &middot; Case ${c.id} of 20</p></div>
      <div class="dm">
        <span class="dp" style="border:1px solid rgba(255,255,255,.3)">${tl}</span>
        <span class="dp">Asl: <strong>${c.base}</strong></span>
        <span class="dp">Total: <strong>&#8358;${c.total_value.toLocaleString()}</strong></span>
        <span class="dp">Inheriting: <strong>${inh.length}</strong></span>
        ${blk.length?"<span class=\"dp\">Blocked: <strong>"+blk.length+"</strong></span>":""}
        ${excl.length?"<span class=\"dp\">Excluded: <strong>"+excl.length+"</strong></span>":""}
      </div>
    </div>
    <div class="stl">Estate Valuation</div>
    <div class="ev">
      <span>Cash: <strong>&#8358;${c.cash.toLocaleString()}</strong></span>
      <span>+ Assets: <strong>&#8358;${c.asset_value.toLocaleString()}</strong></span>
      <span>= Total: <strong>&#8358;${c.total_value.toLocaleString()}</strong></span>
    </div>
    <div class="stl">Estate Assets</div>
    <div class="ag">${assH}</div>
    <div class="stl">Inheritance Shares</div>
    <table class="st"><thead><tr><th>Heir</th><th>N</th><th>Status</th><th>Share</th><th>Per Person</th><th>Amount (&#8358;)</th></tr></thead><tbody>${tblR}</tbody></table>
    ${notH?"<div class=\"stl\">Fiqh Notes</div>"+notH:""}
    <div class="cr">
      <div class="cb" style="max-width:260px"><h3>Share Distribution</h3><canvas id="pc" height="190"></canvas></div>
      <div class="cb"><h3>Cash vs Asset Composition</h3><canvas id="bc" height="190"></canvas></div>
    </div>`;
  if(pc)pc.destroy();if(bc)bc.destroy();
  const piD=inh.filter(r=>f2n(r.share_fraction)>0);
  const cols=["#1a6b2a","#c9961a","#2c8c45","#7b3f00","#1565c0","#7b1fa2","#c0392b","#e65100","#00695c","#4a1f7a"];
  pc=new Chart(document.getElementById("pc"),{type:"doughnut",
    data:{labels:piD.map(r=>r.heir+" ("+r.share_fraction+")"),
      datasets:[{data:piD.map(r=>f2n(r.share_fraction)),backgroundColor:cols,borderWidth:2,borderColor:"#fff"}]},
    options:{plugins:{legend:{position:"bottom",labels:{font:{size:10},boxWidth:12}}},cutout:"55%"}});
  bc=new Chart(document.getElementById("bc"),{type:"bar",
    data:{labels:["Cash","Asset Value","Total Estate"],
      datasets:[{label:"Value",data:[c.cash,c.asset_value,c.total_value],
        backgroundColor:["#c9961a","#1a6b2a","#0f3d1f"],borderRadius:6}]},
    options:{plugins:{legend:{display:false}},
      scales:{y:{ticks:{callback:v=>"\u20a6"+Math.round(v/1e6)+"M"},title:{display:true,text:"Naira"}},
               x:{ticks:{font:{size:11}}}}}});
}
</script>
